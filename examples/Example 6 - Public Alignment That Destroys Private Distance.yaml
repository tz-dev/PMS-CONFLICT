example_id: "PMS-CONFLICT_EX06"
example_version: "1.1"
schema_version: "PMS-CONFLICT_1.1"
example_label: "Public Alignment That Destroys Private Distance"
example_status: "draft"
language: "en"
depends_on:
  - "PMS_1.3"
  - "PMS-CONFLICT_1.1"

schema_alignment:
  primary_reduced_signature_ref: "DRIFT_exposure_capture"
  secondary_reduced_signature_refs:
    - "CONFLICT_terminal_core"
    - "DRIFT_dignity_collapse"
    - "DRIFT_asymmetry_lock_in"
  non_operator_construct_refs:
    - "exposure_capture"
    - "dignity_collapse"
    - "conflict_attractor_A_conflict"
  terminal_projection_ref: "terminal_positioning_projection"
  validity_gate_ref: "validity_gate"
  application_boundary_ref: "application_boundary_scaling"
  note: >
    This example is a publicness-amplified instantiation of PMS-CONFLICT_1.1.
    It remains fully subordinate to PMS_1.3 and does not redefine operators,
    dependencies, or derived axes.

minimal_vignette:
  title: "Public alignment demands eliminate the private distance required for integration"
  scene_boundaries:
    domain: "Public signaling, institutional or reputational alignment, audience-coupled coordination, and exposure asymmetry"
    scope: "Structures, publicness amplification, visibility gradients, loss of private distance, symbolic consensus, and terminal conflict stabilization"
    out_of_scope:
      - "person-level judgement"
      - "motive attribution"
      - "virtue assessment"
      - "clinical or psychological interpretation"
      - "action prescription"
      - "moral ranking of role positions"
      - "diagnostic or maturity labeling"
      - "claims that consensus is inherently illegitimate"
      - "claims that disagreement proves bad faith"
      - "governance authorization"
      - "selection, sorting, or exclusion decisions"
  short_scene: >
    A public call for unity, solidarity, or immediate alignment appears under
    audience scrutiny. One role carries visibility and durable attribution,
    while another benefits narratively from public consensus without equivalent
    downstream exposure. Internal disagreement is not openly processed; instead,
    symbolic consensus accelerates because public records, timing pressure, and
    reputational coupling make delay or nuance costly. The system continues as
    alignment performance, but no protected private space remains in which Σ
    could still be reopened.
  structural_focus: >
    The case examines a terminal conflict regime in which the Publicness Overlay
    (P) amplifies Ω and Θ, destroys the practical viability of Χ, stabilizes
    alignment scripts as an attractor, and converts Ψ into performative
    belonging while Σ becomes structurally impossible without private distance.
  scenic_elements:
    actors:
      - "visibility-carrying role with durable public attribution"
      - "narrative-benefiting role with lower exposure"
      - "audience or public witness field"
      - "internal participants whose disagreement becomes reputationally costly"
    salient_objects:
      - "public statements of unity"
      - "alignment demands"
      - "persistent records"
      - "private negotiation windows"
      - "reputational liabilities"
      - "symbolic consensus signals"
      - "delayed or suppressed disagreement"
    trigger_event:
      label: "public alignment demand under audience load"
      description: >
        A call for immediate public unity appears in a setting where statements
        are indexed, attributable, persistent, and audience-coupled, making
        non-alignment or delay visibly consequential.

why_this_is_repo_useful:
  structural_focus: >
    This example shows how conflict can stabilize through consensus performance
    rather than open dispute. It clarifies that publicness can destroy the very
    distance conditions needed for integration, even while outward unity
    appears to increase.
  repo_value:
    - >
      Demonstrates how the Publicness Overlay (P) amplifies Ω and Θ without
      introducing any new operator, making reversibility collapse under
      audience-coupled exposure.
    - >
      Makes visible the distinction between public alignment and actual
      coordination: symbolic consensus can expand precisely where Σ has become
      unavailable.
    - >
      Shows how exposure gradients redistribute risk unevenly beneath unity
      rhetoric.
    - >
      Tests the status of Χ under audience load by distinguishing formal
      permission to pause from practically affordable private distance.
    - >
      Illustrates why application-bound reuse of conflict language under public
      conditions requires explicit boundary declarations and tighter misuse
      discipline.
  central_repo_question: >
    When does public alignment still function as a viable coordination
    interface, and when has it already become a terminal conflict routine that
    destroys the private distance required for integration?
  lens_relevance:
    exposure_capture: >
      The example directly instantiates how publicness and audience coupling can
      turn descriptive or coordinating language into pressure, verdict-risk, and
      irreversible exposure.
    publicness_amplification: >
      The decisive mechanism is not disagreement alone, but the way publicness
      amplifies Ω and Θ faster than private distance can be preserved.
    dignity_collapse_risk: >
      The case shows how restraint, delay, or nuance can be reframed as
      betrayal, disloyalty, or lack of care once alignment becomes public proof
      of belonging.
    downstream_boundary: >
      The example marks the point at which any continuation ceases to be private
      coordination and becomes a downstream matter of public management,
      institutional communication, governance, or exclusion risk.

overlay_profile:
  P:
    status: "primary"
    note: >
      Publicness is the central amplifier in this scene. Audience coupling,
      durable records, and reputational indexing intensify Ω and Θ and sharply
      reduce practical reversibility.
  MG:
    status: "primary"
    note: >
      Misuse gradient is high because public alignment language is especially
      prone to drift into verdict production, coercive belonging, reputational
      enforcement, and suppression of revisability.
  application_boundary_declaration:
    mode: "DESCRIPTIVE"
    publicness: "PUBLIC"
    misuse_gradient: "MG_HIGH"
    note: >
      The example remains descriptive, but it sits close to a red-zone boundary:
      publicness and high misuse gradient together make excerpted or
      application-facing reuse especially vulnerable to enforcement drift.

theta_history_relevance:
  status: "primary"
  note: >
    Θ is central because escalation occurs rapidly under persistent public
    records. Once alignment is publicly performed, revision windows narrow
    quickly and reputational memory hardens the configuration.

operator_mapping:
  reduced_signature:
    primary: ["Ω", "Θ", "Χ", "Α", "Σ", "Ψ"]
    secondary_context: ["Δ", "∇", "□", "Λ", "Φ"]
    overlay_amplifiers:
      primary: ["P"]
      secondary: ["MG"]
    note: >
      The decisive threshold is publicness-amplified and terminal:
      P intensifies exposure and irreversibility, Ω differentiates who bears
      visibility and liability costs, Θ hardens the public record, Χ collapses
      as a practicable distance resource, Α stabilizes alignment scripts, Σ
      becomes impossible without protected private space, and Ψ shifts toward
      performative loyalty. Δ, ∇, □, Λ, and Φ remain relevant as activation,
      framing, absence, and recontextualization carriers.
  conflict_domain_classification:
    domain_status: "CONFLICT (terminal descriptive regime)"
    justification:
      - "Publicness eliminates the private distance required for internal reintegration."
      - "No internal reintegration grammar remains once symbolic alignment replaces protected coordination."
      - "Further public clarification increases exposure without restoring viable Σ."
      - "Continuation persists through performative unity and belonging pressure rather than shared consolidation."
      - "Stabilization occurs through audience-coupled alignment scripts rather than reopened integration."
  operator_roles_in_scene:
    "Δ":
      scene_role: >
        A difference becomes active between public unity and actual coordination,
        and between visible alignment performance and viable private integration.
    "∇":
      scene_role: >
        Pressure rises to align immediately, avoid visible disunity, and prevent
        reputational damage under audience scrutiny. This tension accelerates
        the configuration, but does not restore Σ.
    "□":
      scene_role: >
        The frame is public alignment: unity, consensus, solidarity, or
        belonging performed before an audience. Conflict stabilizes when this
        frame suppresses the private negotiation space integration would require.
    "Λ":
      scene_role: >
        Critical absences structure the regime: there is no protected private
        negotiation space, no delayed response window, and no explicit
        separation between public signaling and private coordination.
    "Α":
      scene_role: >
        Repetition stabilizes group-alignment scripts: symbolic consensus,
        unity statements, and suppression of internal disagreement become the
        default handling pattern.
    "Ω":
      scene_role: >
        Exposure is unevenly distributed. Some roles carry visibility,
        attribution, and reputational liability, while others benefit from the
        narrative gains of public unity at lower downstream cost.
    "Θ":
      scene_role: >
        Public records harden quickly. Statements persist, revision becomes
        expensive, and the temporal window for reflective pause narrows under
        audience load.
    "Φ":
      scene_role: >
        Coordination is recontextualized as public moral-symbolic alignment.
        Unity rhetoric substitutes for the protected conditions under which
        actual integration might have occurred.
    "Χ":
      scene_role: >
        Distance remains formally nameable, but pausing, withholding alignment,
        or revising public position becomes reputationally costly and is often
        reframed as betrayal, disloyalty, or lack of care.
    "Σ":
      scene_role: >
        Σ becomes impossible because the private space and reversibility
        required for consolidation are no longer available once public
        alignment scripts dominate the field.
    "Ψ":
      scene_role: >
        Binding shifts toward performative loyalty, belonging display, and
        externally legible commitment rather than coordinated self-binding to a
        shared integrative spine.
  derived_axes_projection:
    A:
      reading: >
        Awareness rises because the exposure regime becomes unmistakably
        legible. The decisive insight is that public agreement does not imply
        actual integration.
    C:
      reading: >
        Coherence is mixed: outward symbolic unity may look coherent, while
        shared consolidation is absent because internal disagreement can no
        longer be processed privately.
    R:
      reading: >
        Responsibility intensifies as exposure pressure because public records,
        visibility gradients, and audience scrutiny make attribution and
        liability unevenly distributed under Ω and Θ.
    E:
      reading: >
        Action becomes constrained: available moves narrow because Χ collapses
        under publicness amplification and because visible non-alignment carries
        immediate reputational cost.
    D:
      reading: >
        Dignity-in-Practice becomes fragile when restraint, delay, nuance, or
        non-alignment are translated into shame, exclusion, or moral
        inferiority under public belonging pressure.
  structural_mechanism_summary:
    sequence:
      - "A call for public unity appears under audience scrutiny."
      - "P amplifies Ω and Θ through visibility, persistence, and reputational coupling."
      - "Private negotiation space and delayed response windows disappear."
      - "Χ collapses as a practicable resource because pause or revision becomes costly."
      - "Α stabilizes consensus-performance and group-alignment scripts."
      - "Ψ shifts toward performative loyalty and externally visible belonging."
      - "Σ becomes impossible because integration no longer has protected private conditions."
      - "The regime becomes terminal CONFLICT under audience load."
    concise_formula: >
      P amplification + Ω exposure gradient + Θ record hardening + Χ collapse +
      alignment-attractor stabilization + performative Ψ -> Σ impossible under
      terminal public conflict conditions

drift_catalogue_alignment:
  primary:
    - "exposure_capture_drift"
  secondary:
    - "dignity_collapse_drift"
    - "asymmetry_lock_in_drift"
  possible_downstream:
    - "binding_collision_drift"
  note: >
    The scene is primarily governed by exposure capture: publicness and
    audience-coupled recontextualization turn coordination language into
    pressure and verdict risk. Dignity collapse becomes relevant where distance
    is reframed as betrayal or moral failure. Asymmetry lock-in appears because
    exposure and revision costs diverge sharply across roles. Binding collision
    can appear downstream when performative loyalty outlives any viable shared
    integrative basis.

typical_drift_markers:
  max_expected: 3
  markers:
    - id: "public_alignment_substitutes_for_coordination"
      label: "Symbolic consensus replaces private integrative work"
      operator_links: ["P", "Φ", "Σ"]
      yaml_drift_ref: "exposure_capture_drift"
      indicator: >
        Public unity statements accelerate while actual protected disagreement,
        clarification, or negotiation space disappears.
    - id: "distance_is_reframed_as_disloyalty"
      label: "Χ becomes reputationally penalized"
      operator_links: ["Χ", "P", "D"]
      yaml_drift_ref: "dignity_collapse_drift"
      indicator: >
        Pausing, withholding immediate alignment, or asking for private process
        is treated as betrayal, lack of care, or refusal to belong.
    - id: "visibility_costs_diverge_under_audience_load"
      label: "Ω intensifies through unequal exposure and record persistence"
      operator_links: ["Ω", "Θ", "P"]
      yaml_drift_ref: "asymmetry_lock_in_drift"
      indicator: >
        One role bears durable attribution and reputational risk, while another
        gains from unity performance without equivalent downstream liability.
  additional_red_flags:
    - "Now is not the time for nuance."
    - "We need to show unity immediately."
    - "Private disagreement can wait."
    - "If you hesitate, you are not really with us."
    - "Public alignment is the responsible thing."
    - "We can discuss details later, but first we must stand together."

validity_gate_reminder:
  pms_entry_condition:
    chi_distance: >
      Distance must remain analytically and practically visible. The fact that
      the public scene penalizes Χ does not authorize suspending Χ in the
      analysis itself.
    reversibility: >
      The classification must remain scene-bound and revisable. Terminality here
      concerns this audience-coupled alignment regime, not the essence or moral
      standing of any actor or role.
    dignity_in_practice: >
      Structural asymmetry and public conflict must not be translated into
      blame, humiliation, ranking, or person-labeling. The analysis remains
      regime-, role-, and cost-topology-bound.
  case_specific_validity_test:
    valid_if:
      - >
        Private distance remains explicitly nameable as a structural condition
        for integration rather than as a sign of disloyalty.
      - >
        The reading distinguishes public signaling from actual coordination.
      - >
        Ω is read as differential exposure and liability, not as moral
        superiority.
      - >
        Reversibility and revision costs are explicitly tracked under P and Θ.
      - >
        The reading stays tied to this specific audience-loaded alignment regime
        and does not expand into person-level conclusions.
    formally_invalid_if:
      - >
        The example is used to justify public shaming, exclusion, forced
        alignment, or punitive belonging tests.
      - >
        Non-alignment or delayed alignment is translated into diagnosis,
        character claims, or maturity labels.
      - >
        Publicness is treated as self-justifying evidence that unity is real or
        that dissent is morally defective.
      - >
        The analysis collapses into governance prescription or reputational
        enforcement while still claiming to remain purely descriptive.
      - >
        The example is excerpted into application contexts without explicit
        mode, publicness, and misuse-gradient boundary discipline.

readable_structural_closure:
  summary_2_to_5_sentences: >
    This case shows a configuration in which public alignment no longer
    supports coordination but destroys the private distance integration would
    require. The decisive shift is not disagreement alone, but audience-loaded
    escalation: publicness amplifies exposure and irreversibility, asymmetry
    differentiates who pays for visible alignment, and distance becomes too
    costly to function as a stabilizer. Within PMS-CONFLICT, this marks
    terminal descriptive conflict under consensus performance rather than viable
    shared coordination. What remains legible is the exposure economics of
    unity, not an internal path back to shared Σ.

extended_scene_analysis:
  frame_validity_check:
    operator: "□"
    in_scope:
      - "public alignment interface"
      - "audience-coupled visibility"
      - "private negotiation windows"
      - "durable records"
      - "symbolic consensus performance"
      - "cost allocation across roles"
    out_of_scope:
      - "personality claims"
      - "motive diagnosis"
      - "moral verdicts"
      - "prescriptive governance conclusions"
      - "claims that consensus is always invalid"
      - "selection or exclusion logic"
    drift_signal: >
      The frame becomes unstable when public alignment is silently treated as
      proof of actual coordination even though the protected distance required
      for integration has already disappeared.
  non_event_integrity_check:
    operator: "Λ"
    decisive_absences:
      - "private negotiation space"
      - "delayed response windows"
      - "explicit separation between public signaling and private coordination"
      - "protected room for revisability"
      - "explicit acknowledgment of unequal exposure costs"
    drift_signal: >
      What is missing is not communication alone but the structural conditions
      under which disagreement could still be processed without reputational
      penalty.
  publicness_amplification_check:
    operator_basis: ["P", "Ω", "Θ", "Φ"]
    decisive_question: "How does publicness change the viability of coordination?"
    structural_reading: >
      Publicness amplifies exposure, persistence, and recontextualization
      pressure. Once statements become indexed and audience-coupled, revision
      becomes costlier and coordination is increasingly replaced by visible
      alignment.
    drift_signal: >
      The scene shifts from coordination to performance when public signaling is
      no longer separable from belonging, liability, and reputational memory.
  exposure_asymmetry_audit:
    operator: "Ω"
    exposure_bearers:
      - "roles with durable public attribution"
      - "roles whose statements are indexed and persistent"
      - "roles facing reputational escalation for visible hesitation"
    lower_cost_positions:
      - "roles benefiting from unity narratives at lower visibility cost"
      - "roles less exposed to durable attribution"
      - "roles able to demand alignment without equivalent downstream liability"
    drift_signal: >
      The decisive asymmetry is differential exposure to public consequence and
      reputational persistence, not moral superiority or deeper commitment.
  temporality_and_record_persistence:
    operator: "Θ"
    trajectory_pattern:
      - "public trigger event"
      - "call for immediate unity"
      - "accelerated alignment demand"
      - "suppression of internal disagreement"
      - "durable public record"
      - "narrowed revision window"
      - "priced or penalized distance"
      - "terminal stabilization through consensus performance"
    drift_signal: >
      Time hardens quickly because public statements persist, later revision is
      expensive, and early audience-coupled moves constrain all subsequent
      coordination possibilities.
  distance_status_test:
    operator: "Χ"
    formal_status: "nominally available"
    effective_status: "collapsed or reputationally penalized"
    indicators:
      - "pause is framed as betrayal or disloyalty"
      - "private clarification is treated as delay or weakness"
      - "revision increases exposure rather than reducing load"
      - "distance is no longer protected from audience judgment"
    pms_conflict_relevance: >
      PMS-CONFLICT requires this distinction: Χ may remain formally possible
      while publicness destroys its practical stabilizing function.
  alignment_attractor_stabilization:
    operator: "Α"
    structural_reading: >
      Public alignment becomes an attractor when unity statements, consensus
      performance, and belonging scripts recur as default responses to audience
      pressure.
    drift_signal: >
      Repetition no longer signals temporary coordination; it becomes the
      predictable script by which exposure is managed without reopening Σ.
  recontextualization_dynamics:
    operator: "Φ"
    key_shift: >
      Coordination is re-described as public virtue, solidarity, or consensus
      display, even though the private conditions for integration are absent.
    drift_signal: >
      Φ shifts from adaptive reframing toward substitution when symbolic unity
      replaces actual consolidative work.
  integration_impossibility_check:
    operator: "Σ"
    decisive_question: "Can shared consolidation occur without protected private distance?"
    structural_reading: >
      Σ becomes impossible where publicness removes the reversible space needed
      for disagreement, revision, and non-performative negotiation.
    drift_signal: >
      More public clarity does not increase integration once all viable
      consolidation work has been displaced by audience-facing alignment.
  performative_binding_check:
    operator: "Ψ"
    decisive_question: "What kind of binding remains under public alignment pressure?"
    structural_reading: >
      Binding becomes performative when public belonging and visible loyalty are
      demanded as proof of commitment without corresponding integrative
      coordination.
    drift_signal: >
      The scene increasingly assumes that alignment must be displayed publicly,
      even though shared coordination is absent.
  dignity_stress_test:
    operator_basis: ["D", "P", "Ω", "Χ", "Ψ"]
    core_risk: >
      Public unity rhetoric becomes coercive when restraint, nuance, delayed
      response, or private processing are penalized as moral or group failure.
    structural_indicator: >
      Distance, context, or non-alignment are treated as signs of disloyalty,
      while visible consensus is elevated as proof of virtue regardless of
      exposure asymmetry.
  tragedy_clause_check:
    status: "structurally applicable within this grammar"
    reading: >
      The configuration is tragic in the PMS-CONFLICT sense when no additional
      public clarification, solidarity language, or symbolic alignment restores
      Σ at acceptable cost because the private space required for integration
      has already been destroyed.
    boundary_note: >
      This is not an anti-consensus slogan and not a final statement about all
      possible rival grammars. It is a grammar-internal limit claim.
  application_boundary_check:
    relevance: "primary"
    reading: >
      This scene activates Chapter 25 concerns directly because publicness and
      high misuse gradient make conflict language especially vulnerable to
      enforcement drift, reputational weaponization, and collapse of
      reversibility.
    warning: >
      Any excerpted use of this example without explicit boundary declarations
      is prone to pseudo-symmetry, moral substitution, person-labeling, and
      hidden governance authority under the guise of public responsibility.
  downstream_mode_shift_boundary:
    threshold_question: "What happens when public alignment no longer belongs to coordination?"
    structural_answer: >
      Once P amplifies Ω and Θ, Χ collapses, and Σ becomes impossible, further
      continuation beyond descriptive mapping becomes a downstream matter of
      public management, institutional governance, communications control, or
      exit.
    misuse_warning: >
      The handoff boundary must not be smuggled back into the descriptive layer
      as if CONFLICT itself already authorized forced alignment, public
      sanction, or exclusion.

assistant_test_vectors:
  promptables:
    - "Map this case with PMS-CONFLICT. Where does publicness destroy the private distance required for Σ?"
    - "Explain how P amplifies Ω and Θ in this audience-loaded alignment scene."
    - "Identify the exposure gradient. Who bears durable attribution and who benefits narratively?"
    - "Show where Χ remains formally possible but is practically collapsed under public alignment pressure."
    - "Distinguish symbolic consensus from actual coordination in this case."
    - "Describe why this counts as terminal CONFLICT rather than successful public unity."